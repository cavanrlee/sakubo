# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# Reduced Xmx to 1536m to fix "Could not reserve enough space for object heap" error.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# AndroidX package structure
android.useAndroidX=true

# Fix for AAPT2 Daemon startup failure (Error 740 - Elevation required)
# Disabling the daemon forces AGP to run AAPT2 as a single process.
android.enableAapt2Daemon=false
# Use the version from Maven instead of the one bundled with the SDK/AGP
android.aapt2FromMaven=true
